<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:red;
}

.search{
padding:10px;
width:50%;
border:none;
border-radius:20px;
outline:none;
}

.section{
margin-top:20px;
margin-bottom:10px;
font-size:20px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#1a1a1a;
border-radius:12px;
overflow:hidden;
text-decoration:none;
color:white;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.title{
padding:10px;
font-size:14px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">🎬 MOVIE HUB</div>
<input type="text" class="search" placeholder="Search...">
</div>

<div class="section">
Trending
</div>

<div class="grid">

<!-- VIDEO 1 -->
<a class="card" href="https://yourlink1.com">
<img src="https://picsum.photos/300/400">
<div class="title">
Fantasy World Part 1
</div>
</a>

<!-- VIDEO 2 -->
<a class="card" href="https://yourlink2.com">
<img src="https://picsum.photos/301/400">
<div class="title">
Dragon Story Part 2
</div>
</a>

</div>

</body>
</html>
