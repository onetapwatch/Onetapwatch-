<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneTapWatch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:15px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:26px;
font-weight:bold;
color:red;
letter-spacing:1px;
}

.search{
padding:10px;
width:55%;
border:none;
border-radius:20px;
outline:none;
}

/* SECTION TITLE */
.section{
margin-top:20px;
margin-bottom:10px;
font-size:20px;
font-weight:bold;
}

/* ✅ CHANGED: SINGLE COLUMN LAYOUT */
.grid{
display:flex;
flex-direction:column;
gap:15px;
}

/* CARD */
.card{
background:#1a1a1a;
border-radius:12px;
overflow:hidden;
text-decoration:none;
color:white;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

/* ✅ CHANGED: CINEMATIC IMAGE */
.card img{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
}

/* TITLE */
.title{
padding:10px;
font-size:14px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">ONETAPWATCH</div>
<input type="text" class="search" placeholder="Search...">
</div>

<div class="section">
Trending
</div>

<div class="grid">

<!-- VIDEO 1 -->
<a class="card" href="https://shrinkme.click/N01">
  <img src="https://i.ibb.co/7cwwS6x/aldatan-milf-nilgunun-bol-videolu-ifsa-arsivi-1536x906.webp">
  <div class="title">Cheating MILF Nilgün's Archive</div>
</a>

<!-- VIDEO 2 -->
<a class="card" href="https://yourlink2.com">
  <img src="https://picsum.photos/1200/675">
  <div class="title">Dragon Story Part 2</div>
</a>

<!-- VIDEO 3 -->
<a class="card" href="https://yourlink3.com">
  <img src="https://picsum.photos/1201/675">
  <div class="title">Mystery Episode 3</div>
</a>

</a>

</div>

</body>
</html>
