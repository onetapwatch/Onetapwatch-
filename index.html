<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneTapWatch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:15px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:26px;
font-weight:bold;
color:red;
letter-spacing:1px;
}

.search{
padding:10px;
width:55%;
border:none;
border-radius:20px;
outline:none;
}

/* SECTION TITLE */
.section{
margin-top:20px;
margin-bottom:10px;
font-size:20px;
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

/* CARD */
.card{
background:#1a1a1a;
border-radius:12px;
overflow:hidden;
text-decoration:none;
color:white;
transition:0.3s;
}

.card:hover{
transform:scale(1.04);
}

.card img{
width:100%;
height:180px; /* MEDIUM SIZE */
object-fit:cover;
}

.title{
padding:10px;
font-size:14px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">ONETAPWATCH</div>
<input type="text" class="search" placeholder="Search...">
</div>

<div class="section">
Trending
</div>

<div class="grid">

<!-- VIDEO 1 -->
<a class="card" href="https://shrinkme.click/N01">
<img src="https://i.ibb.co/xxxxx/image.jpg">
<div class="title">Cheating MILF Nilgün's Archive of Extensive Videos</div>
</a>

<!-- VIDEO 2 -->
<a class="card" href="https://yourlink2.com">
<img src="https://picsum.photos/301/400">
<div class="title">Dragon Story Part 2</div>
</a>

<!-- ADD MORE BELOW -->
<!--
<a class="card" href="YOUR_LINK">
<img src="YOUR_IMAGE">
<div class="title">YOUR TITLE</div>
</a>
-->

</div>

</body>
</html>
