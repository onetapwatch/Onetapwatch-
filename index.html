<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Hub</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
margin:0;
padding:15px;
}

h1{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card p{
padding:10px;
text-align:center;
}
</style>

</head>

<body>

<h1>🎬 Movie Hub</h1>

<div class="grid">

<a class="card" href="https://example.com">
<img src="https://picsum.photos/300/400">
<p>Fantasy Part 1</p>
</a>

<a class="card" href="https://example.com">
<img src="https://picsum.photos/301/400">
<p>Fantasy Part 2</p>
</a>

</div>

</body>
</html>
